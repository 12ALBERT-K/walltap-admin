<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walltap Admin</title>
  <style>
    :root {
      --base03: #002b36; --base02: #073642; --base01: #586e75;
      --base0: #839496; --base1: #93a1a1;
      --cyan: #2aa198; --blue: #268bd2; --red: #dc322f; --green: #859900; --yellow: #b58900;
      --font: "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--base03); color: var(--base1); min-height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.2rem;
      background: var(--base02); border-bottom: 1px solid #0f4a57;
    }
    header h1 { font-size: 1.1rem; color: var(--base1); }
    .spacer { flex: 1; }
    .tabs { display: flex; gap: 1rem; }
    .tabs button, .logout {
      background: none; border: none; color: var(--base0); cursor: pointer; font-size: 0.9rem;
      padding: 0.3rem 0.6rem; border-radius: 6px;
    }
    .tabs button.active { color: var(--cyan); font-weight: 600; }
    .tabs button:hover, .logout:hover { background: rgba(147,161,161,0.12); }
    main { padding: 1.2rem; max-width: 960px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--base02); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem;
      border: 1px solid #0f4a57;
    }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
    .stat .num { font-size: 1.6rem; font-weight: 700; color: var(--cyan); }
    .stat .lbl { font-size: 0.75rem; color: var(--base0); text-transform: uppercase; letter-spacing: 0.5px; }
    h2 { font-size: 0.95rem; color: var(--base1); margin-bottom: 0.7rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; color: var(--base0); font-weight: 600; padding: 0.4rem 0.5rem; border-bottom: 1px solid #0f4a57; }
    td { padding: 0.4rem 0.5rem; border-bottom: 1px solid #0e3d4a; vertical-align: top; }
    .badge { font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 999px; }
    .badge.admin { background: rgba(133,153,0,0.25); color: var(--green); }
    .badge.user  { background: rgba(38,139,210,0.2); color: var(--blue); }
    .badge.deleted { background: rgba(220,50,47,0.22); color: var(--red); }
    .badge.live { background: rgba(147,161,161,0.15); color: var(--base0); }
    tr.deleted { opacity: 0.65; }
    .msg-text { white-space: pre-wrap; word-break: break-word; }
    .btn-reset, .btn-copy {
      background: transparent; color: var(--cyan); border: 1px solid #0f4a57;
      border-radius: 4px; padding: 0.25rem 0.55rem; font-size: 0.75rem;
      font-family: var(--font); cursor: pointer; white-space: nowrap;
    }
    .btn-reset:hover, .btn-copy:hover { background: rgba(147,161,161,0.12); }
    .btn-reset:disabled { opacity: 0.5; cursor: default; }
    #reset-result { margin-bottom: 1rem; }
    #reset-result .note { font-size: 0.8rem; color: var(--base0); margin: 0 0 0.6rem; }
    .link-row { display: flex; gap: 0.5rem; align-items: center; }
    .link-box {
      flex: 1; min-width: 0; padding: 0.45rem 0.5rem; font-size: 0.75rem;
      font-family: var(--mono); color: var(--base1); background: var(--base03);
      border: 1px solid #0f4a57; border-radius: 4px;
    }
    .axis { display: flex; gap: 2px; align-items: flex-end; height: 120px; }
    .axis .bar {
      flex: 1; background: var(--cyan); border-radius: 3px 3px 0 0; min-width: 6px; position: relative;
      opacity: 0.85;
    }
    .axis .bar:hover { opacity: 1; }
    .axis .label { font-size: 0.6rem; color: var(--base0); text-align: center; margin-top: 2px;
      transform: rotate(-45deg); transform-origin: top left; white-space: nowrap; }
    #auth { position: fixed; inset: 0; background: var(--base03); display: flex; align-items: center;
      justify-content: center; z-index: 10; }
    #auth.hidden { display: none; }
    #auth .box { background: var(--base02); padding: 2rem 1.75rem; border-radius: 10px; width: 340px; }
    #auth h2 { margin-bottom: 0.3rem; }
    #auth p.sub { font-size: 0.82rem; color: var(--base0); margin-bottom: 1.2rem; }
    #auth input {
      width: 100%; margin-bottom: 0.8rem; padding: 0.6rem 0.25rem; font-size: 0.95rem;
      color: var(--base1); background: transparent; border: none; border-bottom: 1.5px solid #0f4a57;
      outline: none; font-family: var(--font);
    }
    #auth input:focus { border-color: var(--cyan); }
    #auth button { width: 100%; padding: 0.6rem; font-weight: 600; color: #fff;
      background: var(--cyan); border: none; border-radius: 6px; cursor: pointer; font-family: var(--font); }
    #auth button:hover { background: var(--blue); }
    #auth .err { color: var(--red); font-size: 0.8rem; margin-top: 0.6rem; min-height: 1.2em; }
    #denied { text-align: center; padding: 4rem 1rem; color: var(--red); font-size: 1.05rem; }
    .err-text { color: var(--red); font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <h1>Walltap · Admin</h1>
  <div class="spacer"></div>
  <nav class="tabs" id="tabs">
    <button data-panel="overview" class="active">Overview</button>
    <button data-panel="users">Users</button>
    <button data-panel="messages">Messages</button>
  </nav>
  <button class="logout" id="logout-btn">Log out</button>
</header>

<main id="app" style="display:none">
  <div class="panel active" id="overview"></div>
  <div class="panel" id="users"></div>
  <div class="panel" id="messages"></div>
</main>

<div id="denied" style="display:none">
  This account is not an admin. If you think this is a mistake, contact the site owner.
</div>

<div id="auth">
  <div class="box">
    <h2>Walltap Admin</h2>
    <p class="sub">Sign in with your admin account</p>
    <input type="email" id="email" placeholder="Email" autocomplete="email" />
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Sign in</button>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
